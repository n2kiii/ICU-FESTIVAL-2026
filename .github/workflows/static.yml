name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check announcement
        id: announcement
        shell: bash
        run: |
          notify=$(jq -r '.announcements[0].notify // false' announcements.json)
          title=$(jq -r '.announcements[0].title // "ICU FESTIVAL 2026"' announcements.json)
          message=$(jq -r '.announcements[0].message // ""' announcements.json)

          echo "notify=$notify"
          echo "title=$title"

          echo "notify=$notify" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: Send OneSignal notification
        if: ${{ steps.announcement.outputs.notify == 'true' }}
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: 1b0e0935-72e0-4e25-b696-01b294373587
          NOTIFICATION_TITLE: ${{ steps.announcement.outputs.title }}
          NOTIFICATION_MESSAGE: ${{ steps.announcement.outputs.message }}

        run: |
          echo "Sending OneSignal notification..."

          curl --fail-with-body -X POST \
            https://api.onesignal.com/notifications \
            -H "Authorization: Key $ONESIGNAL_REST_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg app_id "$ONESIGNAL_APP_ID" \
              --arg title "$NOTIFICATION_TITLE" \
              --arg message "$NOTIFICATION_MESSAGE" \
              '{
                app_id: $app_id,
                included_segments: ["All"],
                headings: {
                  en: $title,
                  ja: $title
                },
                contents: {
                  en: $message,
                  ja: $message
                },
                url: "https://icu-fes.com/"
              }')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
